# Nodo de vision. Los numeros de decimales son obligatorios en los parametros de tipo real (ej. 0.0, no 0).
vision_node:
  ros__parameters:
    # Export NCNN de YOLOv8n-seg (model.ncnn.param/.bin + metadata.yaml), el del repo. Se lee con ncnn directo
    # (pip install ncnn), sin ultralytics ni torch.
    model: /home/mow/lawn-mower-robot/vision/models/ncnn_320
    imgsz: 320                               # debe coincidir con el export (se verifica contra metadata.yaml)
    conf: 0.4
    iou: 0.7                                 # NMS
    threads: 1                               # hilos de ncnn
    # CPU: la Pi 4 esta cerca del limite con todo el robot. 1-2 Hz como maximo (el nodo no pasa de 2,0).
    process_rate_hz: 1.0
    publish_rate_hz: 2.0                     # grass_present con el ultimo resultado (blade_controller: timeout 1 s)
    stale_s: 2.5                             # resultado mas viejo que esto = sin pasto ni obstaculos (> 1/process_rate)
    frame_id: base_footprint
    grass_class: pasto

    # Camara (Logitech Brio 100 por USB)
    # Nombre fijo de la Brio (no cambia aunque pase de /dev/video0 a /dev/video1). Se abre con V4L2.
    # Otra camara: ls /dev/v4l/by-id/ y usar la que termina en -video-index0. Tambien acepta un indice,
    # /dev/videoN o la ruta de un video.
    source: /dev/v4l/by-id/usb-046d_Brio_100_2442ZBN05H18-video-index0
    camera_width: 640
    camera_height: 480
    camera_fps: 15.0
    camera_fourcc: MJPG
    camera_retry_s: 2.5                      # sin camara: status sin_camara, grass_present=false y reintento
    start_capture: true

    min_grass: 0.10                          # fraccion de la imagen que debe ser pasto
    grass_window: 3                          # cuadros (a 1 Hz, ~3 s); "hay pasto" si la mayoria lo vio
    obstacle_classes: [arbol, planta, barrera, otro]
    min_rho: 0.05

    # ── Calibracion y camara: PROVISORIOS, medir con el robot armado ──
    calibrated: false                        # mientras sea false, /vision/obstacles sale vacio
    fov_h_deg: 62.0                          # campo de vision horizontal (supuesto)
    # Fila de la base del objeto [px] (de lejos a cerca, creciente) y distancia real [m] (decreciente).
    # Salen de calibrar.py. Estos son los valores de ejemplo de potential_field.py.
    calib_y: [300.0, 420.0]
    calib_d: [1.5, 0.5]
    # Montaje de la camara en base_footprint (el URDF no la tiene)
    cam_x: 0.0
    cam_y: 0.0
    cam_yaw_deg: 0.0
