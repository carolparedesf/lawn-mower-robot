# EKF local: publica odom -> base_footprint (unica fuente de ese TF).
# Entradas: velocidad lineal vx de la odometria de ruedas + velocidad angular z (vyaw) del IMU.
# El rumbo sale del giroscopio, NO del ancho de via de las ruedas (odom0 no aporta vyaw).
# Orden del vector: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
ekf_local:
  ros__parameters:
    frequency: 15.0
    sensor_timeout: 0.15
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Odometria de ruedas: SOLO vx (sin pose absoluta y sin vyaw: el giro lo aporta el IMU)
    odom0: /odom/unfiltered
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU: SOLO velocidad angular en z (sin yaw absoluto). Es la UNICA fuente de vyaw
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false
