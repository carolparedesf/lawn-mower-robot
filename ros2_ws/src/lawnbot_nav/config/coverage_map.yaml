coverage_map:
  ros__parameters:
    # m por celda. Por defecto 0,5 m. OJO: el GPS tiene ~2-3 m de error, asi que una celda de 0,5 m no es
    # "exactamente la celda" por donde paso el robot; las pasadas son confiables como tendencia, no al cm.
    resolution: 0.5
    padding: 1.0                 # m alrededor de la caja del cerco
    publish_period_s: 2.0        # /coverage/map -> el bridge lo manda por MQTT a robot/map
    pose_rate_hz: 10.0
    count_only_when_cutting: true   # una pasada cuenta solo si /cutter/cmd > 0 durante la visita
    cutting_timeout: 0.5
    hysteresis: 0.15             # fraccion de celda que hay que pasarse del borde para contar el cambio de celda
    use_sonars: true
    sonar_max_range: 1.5
    # Angulo de montaje de los sonares laterales (el URDF los pone al frente, 0). PROVISORIO: medirlo.
    sonar_left_yaw_deg: 0.0
    sonar_right_yaw_deg: 0.0
    frame_id: map
    base_frame: base_footprint
    pose_timeout: 0.5
    # Lat/lng del origen del frame map (para que la app ubique la grilla): navsat = servicio toLL de navsat_transform,
    # param = origin_lat/origin_lng fijos (pruebas), none = sin origin_ll. Se reconsulta cada origin_refresh_s.
    origin_source: navsat
    to_ll_service: toLL
    origin_lat: 0.0
    origin_lng: 0.0
    origin_refresh_s: 10.0
    origin_change_deg: 1.0e-6
