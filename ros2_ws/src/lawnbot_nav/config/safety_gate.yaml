safety_gate:
  ros__parameters:
    input_topic: cmd_vel_mux
    output_topic: cmd_vel
    publish_rate_hz: 20.0
    # Sin comando de entrada en este tiempo [s] se publica cero
    input_timeout: 0.5
    # Sensor requerido (sonar habilitado o bumper frontal) sin datos en este tiempo [s]:
    # se bloquea el avance; retroceso y giro siguen permitidos
    sensor_timeout: 1.0
    # Las alertas de otros nodos (/nav/alert_in, 'fuente:alerta') vencen a los 3 s sin renovarse
    alert_ttl: 3.0

    # Limites extra: solo reducen, nunca amplifican
    max_linear: 0.5      # m/s
    max_angular: 1.5     # rad/s

    # Reglas de distancia sobre el MINIMO de los sonares habilitados [m]
    sonar_slow_distance: 0.30   # por debajo: avance proporcional
    sonar_stop_distance: 0.10   # a esta distancia o menos: avance prohibido (se libera por encima de stop + histeresis = 0.15)
    # Histeresis del bloqueo total: entra a <= sonar_stop_distance y sale recien a > stop + esto [m] (0.10 -> 0.15)
    sonar_stop_hysteresis: 0.05
    # Rampa de subida: la velocidad que dejan pasar los sonares crece como maximo a esta aceleracion [m/s^2] cuando el
    # obstaculo se aleja; baja de inmediato. 0 = sin rampa. Evita el temblor cuando la distancia salta cerca de un umbral
    sonar_release_accel: 0.5
    sonar_left_enabled: true
    sonar_center_enabled: true
    sonar_right_enabled: true
    # Umbrales propios de cada sonar [m]; negativo = usar sonar_slow_distance / sonar_stop_distance
    sonar_left_slow_distance: -1.0
    sonar_left_stop_distance: -1.0
    sonar_center_slow_distance: -1.0
    sonar_center_stop_distance: -1.0
    sonar_right_slow_distance: -1.0
    sonar_right_stop_distance: -1.0
    # En auto_perimeter los sonares LATERALES no cuentan (ni para frenar ni para el dato vigente): seguir una
    # pared de cerca los dispararia. El sonar central y los bumpers siguen protegiendo siempre. Sin un modo
    # vigente (mode_timeout) se vuelven a considerar todos.
    ignore_side_sonars_in_perimeter: true
    mode_timeout: 3.0
    # Topic de cada sonar. Vacio = <sonar_topic_prefix>/<left|center|right>. nav.launch.py pone el prefijo en
    # sonar_filtered (use_sonar_filter:=true, por defecto) o sonar (sin filtro)
    sonar_topic_prefix: sonar
    sonar_left_topic: ''
    sonar_center_topic: ''
    sonar_right_topic: ''

    # Bumpers frontales: prohiben avance (retroceso y giro permitidos)
    bumper_front_topics: [bumper/B1_front_left, bumper/B2_front_right]
    # Bumpers traseros: prohiben retroceso
    bumper_back_topics: [bumper/B5_back]
    # Laterales: sin efecto sobre el movimiento (solo se registran en el log)
    bumper_monitor_topics: [bumper/B3_left, bumper/B4_right]
