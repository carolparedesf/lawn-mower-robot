# Campo abierto de 30 m x 30 m para probar la app con cercos dibujados a escala real. Borde exterior lejano (a 5 m del
# campo, de -5 a 35 en x e y) para que el robot no se escape, y dos barreras para probar auto_perimeter. Centro: (15, 15).
#   - Pared recta de 12 m en x = 19 (de y = 9 a y = 21), 4 m al este del arranque (15, 15) mirando al este.
#   - Barrera en L de 3 x 3 m al oeste: esquina en (9, 13), brazos hasta (9, 16) y hasta (12, 13). Desde el arranque
#     no queda a la vista: para probarla, arrancar fake_robot con x: 15.0, y: 15.0, yaw: 3.14159 (mira al oeste),
#     que choca con el brazo vertical por dentro de la L.
# Uso: ros2 launch lawnbot_nav sim_world.launch.py world:=field
# El cerco de la app se alinea con este mundo con tools/datum_from_fence.py --world field (calcula datum_lat/datum_lng).
fake_robot:
  ros__parameters:
    frame_id: map
    cmd_topic: cmd_vel             # pasa por twist_mux y safety_gate (nav.launch.py)
    publish_sensors: true
    publish_markers: true          # para RViz (config/sim.rviz). Solo simulacion
    sensor_rate_hz: 5.0
    # El angulo de los sonares de las esquinas (corner_sonar_angle_deg) sale de config/robot_geometry.yaml (compartido)
    x: 15.0                        # arranque en el centro del campo
    y: 15.0
    yaw: 0.0
    # Huella del chasis y esquinas delanteras: los mismos valores que sim_room.yaml (ver el comentario ahi)
    body_shape: chassis
    corner_radius: 0.06
    corner_split_deg: 41.0
    corner_dead_deg: 55.0
    walls: [-5.0, -5.0, 35.0, -5.0,
            35.0, -5.0, 35.0, 35.0,
            35.0, 35.0, -5.0, 35.0,
            -5.0, 35.0, -5.0, -5.0,
            # Pared recta de 12 m, 4 m al este del arranque
            19.0, 9.0, 19.0, 21.0,
            # Barrera en L de 3 x 3 m (esquina en (9, 13))
            9.0, 13.0, 9.0, 16.0,
            9.0, 13.0, 12.0, 13.0]
    # Tres obstaculos chicos (el ultimo toca el extremo norte de la pared recta): [x, y, radio, ...]
    obstacles: [11.0, 19.0, 0.3,
                20.0, 11.0, 0.25,
                19.0, 21.0, 0.4]
