# Campo abierto de 30 m x 30 m para probar la app con cercos dibujados a escala real. Sin paredes interiores: solo un
# borde exterior lejano (a 5 m del campo, de -5 a 35 en x e y) para que el robot no se escape. Centro del mundo: (15, 15).
# Uso: ros2 launch lawnbot_nav sim_world.launch.py world:=field
# El cerco de la app se alinea con este mundo con tools/datum_from_fence.py --world field (calcula datum_lat/datum_lng).
fake_robot:
  ros__parameters:
    frame_id: map
    cmd_topic: cmd_vel             # pasa por twist_mux y safety_gate (nav.launch.py)
    publish_sensors: true
    publish_markers: true          # para RViz (config/sim.rviz). Solo simulacion
    sensor_rate_hz: 5.0
    side_sonar_yaw_deg: 45.0       # sonares laterales a +-45 grados (el URDF los pone al frente)
    x: 15.0                        # arranque en el centro del campo
    y: 15.0
    yaw: 0.0
    # Esquinas del cuerpo: mismos valores provisorios que sim_room.yaml (ver el comentario ahi)
    corner_radius: 0.05
    corner_split_deg: 45.0
    corner_dead_deg: 0.0
    walls: [-5.0, -5.0, 35.0, -5.0,
            35.0, -5.0, 35.0, 35.0,
            35.0, 35.0, -5.0, 35.0,
            -5.0, 35.0, -5.0, -5.0]
    # Tres obstaculos chicos: [x, y, radio, ...]
    obstacles: [11.0, 19.0, 0.3,
                20.0, 11.0, 0.25,
                19.0, 21.0, 0.4]
