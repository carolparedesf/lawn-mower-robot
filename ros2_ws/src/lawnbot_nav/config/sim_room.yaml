# Cuarto de 10 m x 8 m con un obstaculo circular y un bloque, para probar random_walk y perimeter con fake_robot.
# Uso: ros2 launch lawnbot_nav sim_world.launch.py   (NO correr ekf_local ni la odometria real a la vez)
fake_robot:
  ros__parameters:
    frame_id: map
    cmd_topic: cmd_vel             # pasa por twist_mux y safety_gate (nav.launch.py)
    publish_sensors: true
    # Para RViz (config/sim.rviz): /sim/markers y /sim/path. Solo simulacion
    publish_markers: true
    sensor_rate_hz: 5.0
    # El angulo de los sonares de las esquinas (corner_sonar_angle_deg) sale de config/robot_geometry.yaml (compartido)
    x: 2.0
    y: 1.0
    yaw: 0.0
    # Huella del chasis (plano CAD, mm): frente de 400 de ancho y 226 de profundidad, trasera de 250 de ancho, largo total 436
    # (body_* en robot_geometry.py). 'rectangle' = el cuerpo rectangular de antes.
    body_shape: chassis
    # Esquinas delanteras (radio 60) y reparto de bumpers en cada arco, en grados desde la cara frontal (0) hacia la lateral (90):
    # B1/B2 entran en el arco hasta corner_split_deg - corner_dead_deg/2 (~13), B3/B4 empiezan en corner_split_deg +
    # corner_dead_deg/2 (~68, a ~38 mm del frente) y en medio (zona muerta de ~55, centrada en 41) no hay bumper.
    corner_radius: 0.06
    corner_split_deg: 41.0
    corner_dead_deg: 55.0
    walls: [0.0, 0.0, 10.0, 0.0,
            10.0, 0.0, 10.0, 8.0,
            10.0, 8.0, 0.0, 8.0,
            0.0, 8.0, 0.0, 0.0,
            4.0, 3.0, 7.0, 3.0,
            7.0, 3.0, 7.0, 5.0,
            7.0, 5.0, 4.0, 5.0,
            4.0, 5.0, 4.0, 3.0]
    obstacles: [2.0, 6.0, 0.5]
