# Cuarto de 10 m x 8 m con un obstaculo circular y un bloque, para probar random_walk y perimeter con fake_robot.
# Uso: ros2 launch lawnbot_nav sim_world.launch.py   (NO correr ekf_local ni la odometria real a la vez)
fake_robot:
  ros__parameters:
    frame_id: map
    cmd_topic: cmd_vel             # pasa por twist_mux y safety_gate (nav.launch.py)
    publish_sensors: true
    # Para RViz (config/sim.rviz): /sim/markers y /sim/path. Solo simulacion
    publish_markers: true
    sensor_rate_hz: 5.0
    side_sonar_yaw_deg: 45.0       # sonares laterales a +-45 grados (el URDF los pone al frente)
    x: 2.0
    y: 1.0
    yaw: 0.0
    # Esquinas del cuerpo redondeadas (a medir en el robot real; los valores son provisorios). Cada arco se reparte
    # entre el bumper frontal/trasero (B1/B2/B5) y el lateral (B3/B4) segun el angulo del punto de contacto, medido
    # desde la cara frontal/trasera: hasta corner_split_deg - corner_dead_deg/2 el frontal/trasero, desde
    # corner_split_deg + corner_dead_deg/2 el lateral, y en medio (zona muerta) ninguno. corner_radius 0 = cuerpo rectangular.
    corner_radius: 0.05
    corner_split_deg: 45.0
    corner_dead_deg: 0.0
    walls: [0.0, 0.0, 10.0, 0.0,
            10.0, 0.0, 10.0, 8.0,
            10.0, 8.0, 0.0, 8.0,
            0.0, 8.0, 0.0, 0.0,
            4.0, 3.0, 7.0, 3.0,
            7.0, 3.0, 7.0, 5.0,
            7.0, 5.0, 4.0, 5.0,
            4.0, 5.0, 4.0, 3.0]
    obstacles: [2.0, 6.0, 0.5]
