perimeter:
  ros__parameters:
    rate_hz: 20.0
    # TF con la pose real, para medir el avance entre contactos (esquina por falta de progreso). odom en el robot;
    # map con fake_robot cuando su frame_id es map (sim_room.yaml). Sin la TF se integra v*dt (y el log avisa una vez).
    frame_id: odom
    base_frame: base_footprint
    pose_timeout: 0.5
    sensor_timeout: 1.0
    side: right                    # lado de la pared: left | right (bumper B3 / B4 de ese lado)
    linear: 0.15                   # m/s
    max_angular: 0.5               # rad/s

    # ── Modo base: contacto con el bumper lateral ──
    seek_turn: 0.3                 # rad/s: curva hacia la pared mientras no hay contacto
    contact_back_speed: 0.10       # m/s: al tocar, retrocede derecho antes de girar (la cola no barre la pared)
    contact_back_distance: 0.10    # m de retroceso
    contact_turn_angle_deg: 15.0   # giro en el lugar para alejarse tras un contacto lateral
    front_contact_turn_angle_deg: 45.0   # idem tras un contacto frontal (esquina interior)
    contact_turn_speed: 0.5        # rad/s
    contact_unwedge_after_s: 1.0   # si al girar el bumper sigue presionado (la cola roza), avanza un poco
    contact_forward_speed: 0.08
    contact_forward_time_s: 1.5
    contact_timeout_s: 6.0         # contacto continuo por mas de esto = trabado
    unstick_attempts: 2            # intentos de liberarse (retroceso en arco) antes de perimeter_blocked
    unstick_speed: 0.10
    unstick_turn: 0.4
    unstick_time_s: 2.5
    bump_lost_timeout_s: 10.0      # sin contacto por mas de esto = borde perdido -> busqueda acotada

    # ── Sonar central: esquina interior anticipada ──
    use_center_sonar: true
    obstacle_distance: 0.45
    corner_turn_speed: 0.6
    corner_clear_ratio: 1.3
    corner_timeout_s: 8.0
    corner_back_distance: 0.12     # m: si girando en la esquina se presiona el bumper lateral, retrocede esto antes de seguir

    # Esquina por falta de progreso: stalled_contacts contactos laterales seguidos con menos de
    # stalled_progress_distance de avance ordenado entre uno y otro se tratan como contacto frontal (giro de 45). 0 = apagado
    stalled_contacts: 3
    stalled_progress_distance: 0.15  # m

    # ── Refinamiento opcional: sonar lateral ──
    use_side_sonar: false          # solo se usa si ademas corner_sonar_angle_deg es valido (>= 20)
    # El angulo del sonar lateral respecto del frente (90 = de costado) es corner_sonar_angle_deg (config/robot_geometry.yaml,
    # compartido con el URDF, fake_robot, potential_field y coverage_map). PROVISORIO: medirlo.
    target_distance: 0.30          # m (no menos: el gate frena con un sonar < 0,30 m salvo que se lo ignore)
    kp: 1.5
    max_range: 1.5
    lost_distance: 0.9
    lost_timeout_s: 0.6
    sonar_forward_offset: 0.19
    outer_corner_extra: 0.10

    # ── Busqueda inicial del borde: recto hasta el primer contacto o deteccion del sonar ──
    search_speed: 0.15             # m/s
    search_timeout_s: 120.0        # tiempo total antes de rendirse (perimeter_lost)
    search_edge_margin: 1.0        # m: a menos del borde del cerco y mirando hacia afuera, gira hacia adentro y sigue buscando
    search_turn_speed: 0.5         # rad/s
    search_edge_spread_deg: 30.0   # variacion al azar del giro hacia el centroide
    search_edge_turn_min_deg: 120.0   # sin cerco/pose: giro al azar entre estos angulos
    search_edge_turn_max_deg: 180.0
    seed: -1                       # -1: al azar
    geofence_frame_id: map         # frame del cerco (geofence/polygon)

    # ── Busqueda acotada al perder un borde ya encontrado ──
    search_arc_time_s: 4.0
    search_arc_linear: 0.1
    search_arc_turn: 0.4
    search_forward_time_s: 3.0
    lost_search_timeout_s: 25.0    # tiempo total antes de rendirse (perimeter_lost)
