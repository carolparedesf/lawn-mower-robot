# gps_node: gpsd -> /gps/fix (NavSatFix para navsat_transform). Filtros en berryimu_gps/gps_filter.py
berryimu_gps_node:
  ros__parameters:
    gpsd_host: 127.0.0.1
    gpsd_port: 2947
    frame_id: BerryGPS_Link

    # Covarianza: epx/epy/eph/epv de gpsd son errores al 95 %; sigma = ep * ep_to_sigma
    ep_to_sigma: 0.5
    min_sigma_m: 0.5                # piso del sigma [m]
    fallback_sigma_m: 10.0          # sin epx/epy ni eph [m]
    fallback_vertical_variance: 1.0e4

    # Fixes descartados (no se publican). <= 0 desactiva el limite de eph o de HDOP
    require_3d: true                # fixes 2D afuera
    max_eph_m: 8.0
    max_hdop: 2.5                   # HDOP del ultimo reporte SKY de gpsd

    # Saltos: rechazo si el fix se aleja del ultimo aceptado mas que max_speed * dt + jump_sigmas * sigma.
    # Despues de jump_accept_after rechazos seguidos se acepta igual (0 = sin rechazo de saltos)
    max_speed: 0.8                  # m/s
    jump_sigmas: 3.0
    jump_accept_after: 5
