; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── Base compartida por todos los environments ───────────────────────────────
[common]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
upload_protocol = esptool
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
monitor_dtr = 0
monitor_rts = 0
 
; Libs propias del proyecto
build_flags =
    -I lib/pid
    -I lib/encoder
    -I lib/motor
    -I lib/diffdrive
    -I lib/sonar
    -I lib/bumper
    -I lib/battery
    -I lib/buzzer
    -I lib/display
 
; Dependencias externas comunes
lib_deps_common =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    madhephaestus/ESP32Encoder @ ^0.10.1
 
; ── Entorno principal ────────────────────────────────────────────────────────

[env:mow]
extends = common
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_microros_distro = humble
board_microros_transport = serial
src_filter = +<main.cpp>
lib_deps = https://github.com/micro-ROS/micro_ros_platformio
    ${common.lib_deps_common}

; ── Test mínimo micro-ROS: Int32 contador cada 100 ms (descarta hardware) ────
; No extiende [common]: sin libs ni -I del robot. Solo compila microros_min.cpp.
[env:microros_min]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
upload_protocol = esptool
monitor_speed = 921600
monitor_port = /dev/ttyUSB0
monitor_dtr = 0
monitor_rts = 0
board_microros_distro = humble
board_microros_transport = serial
src_filter = +<microros_min.cpp>
lib_deps = https://github.com/micro-ROS/micro_ros_platformio

; ── Test: INA228 / BatteryManager ───────────────────────────────────────────
[env:test_battery]
extends = common
src_filter =+<test_bat_manager.cpp>
lib_deps = ${common.lib_deps_common}

; ── Test: OLED / DisplayManager ─────────────────────────────────────────────
[env:test_display]
extends = common
src_filter =+<test_display.cpp>
lib_deps = ${common.lib_deps_common}
