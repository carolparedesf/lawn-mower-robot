name: robotmapapp
description: "App móvil Flutter para control de robot móvil basado en Raspberry Pi."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  mqtt_client: ^10.0.0
  provider: ^6.0.0
  flutter_joystick: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
